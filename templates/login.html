<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
           background: linear-gradient(135deg, #090808 0%, #825ba9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.4) 0%, transparent 60%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 60%),
                radial-gradient(circle at 40% 40%, rgba(120, 119, 198, 0.3) 0%, transparent 60%),
                radial-gradient(circle at 70% 70%, rgba(102, 126, 234, 0.2) 0%, transparent 50%);
            pointer-events: none;
            animation: backgroundFloat 20s ease-in-out infinite;
        }

        @keyframes backgroundFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
        }

        .login-form {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 450px;
            margin: 0 20px;
        }

        .login-form h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(32px, 5vw, 40px);
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: -0.5px;
            animation: fadeInDown 0.8s ease;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.15),
                0 10px 20px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(102, 126, 234, 0.05), transparent);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            50% { transform: translateX(0%) translateY(0%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .main {
            position: relative;
            z-index: 1;
        }

        .content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 35px;
            color: #2d3748;
            letter-spacing: -0.3px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            color: #2d3748;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            position: relative;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 1);
            box-shadow: 
                0 0 0 3px rgba(102, 126, 234, 0.1),
                0 4px 12px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }

        input::placeholder {
            color: #a0aec0;
            font-weight: 400;
        }

        .btn {
            width: 100%;
            padding: 16px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 8px 16px rgba(102, 126, 234, 0.4),
                0 4px 8px rgba(0, 0, 0, 0.1);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 15px 30px rgba(102, 126, 234, 0.5),
                0 8px 16px rgba(0, 0, 0, 0.15);
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:active {
            transform: translateY(-1px) scale(1);
        }

        .account {
            text-align: center;
            margin-top: 25px;
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
        }

        .account a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .account a:hover {
            color: #5a67d8;
            text-shadow: 0 2px 4px rgba(102, 126, 234, 0.3);
        }

        .account a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .account a:hover::after {
            width: 100%;
        }

        /* Floating elements for enhanced visual appeal */
        .floating-icon {
            position: absolute;
            color: rgba(255, 255, 255, 0.1);
            font-size: 24px;
            animation: float 6s ease-in-out infinite;
            pointer-events: none;
        }

        .floating-icon:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-icon:nth-child(2) {
            top: 20%;
            right: 15%;
            animation-delay: 2s;
        }

        .floating-icon:nth-child(3) {
            bottom: 20%;
            left: 15%;
            animation-delay: 4s;
        }

        .floating-icon:nth-child(4) {
            bottom: 15%;
            right: 10%;
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .login-form {
                margin: 0 15px;
            }

            .container {
                padding: 40px 30px;
            }

            .login-form h1 {
                font-size: 28px;
                margin-bottom: 30px;
            }

            .content h2 {
                font-size: 24px;
                margin-bottom: 25px;
            }

            input[type="text"],
            input[type="password"],
            .btn {
                padding: 14px 16px;
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 35px 25px;
            }

            .login-form h1 {
                font-size: 24px;
            }

            .content h2 {
                font-size: 22px;
            }
        }

        /* Custom alert styling */
        .alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .alert-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .alert-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            margin: 0 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .alert-overlay.show .alert-box {
            transform: scale(1);
        }

        .alert-message {
            color: #2d3748;
            font-size: 16px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .alert-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .alert-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }
    </style>

    <script>
        {% if msg %}
            document.addEventListener('DOMContentLoaded', function() {
                showCustomAlert("{{ msg }}");
            });
        {% endif %}

        function showCustomAlert(message) {
            // Create alert overlay
            const overlay = document.createElement('div');
            overlay.className = 'alert-overlay';
            
            const alertBox = document.createElement('div');
            alertBox.className = 'alert-box';
            
            const alertMessage = document.createElement('div');
            alertMessage.className = 'alert-message';
            alertMessage.textContent = message;
            
            const alertButton = document.createElement('button');
            alertButton.className = 'alert-button';
            alertButton.textContent = 'OK';
            alertButton.onclick = function() {
                overlay.classList.remove('show');
                setTimeout(() => overlay.remove(), 300);
            };
            
            alertBox.appendChild(alertMessage);
            alertBox.appendChild(alertButton);
            overlay.appendChild(alertBox);
            document.body.appendChild(overlay);
            
            // Show with animation
            setTimeout(() => overlay.classList.add('show'), 10);
        }
    </script>
</head>

<body>
    <!-- Floating decorative elements -->
    <div class="floating-icon">🔒</div>
    <div class="floating-icon">👤</div>
    <div class="floating-icon">🔑</div>
    <div class="floating-icon">✨</div>

    <div class="login-form">
        <h1><b>User Login</b></h1>
        <div class="container">
            <div class="main">
                <div class="content">
                    <h2>Welcome </h2>
                    <form action="{{ url_for('login') }}" method="post">
                        <input type="text" name="Email" placeholder="Email Address" required autofocus="">
                        <input type="password" name="Password" placeholder="Enter Password" required>
                        
                        <button class="btn" type="submit">
                            Sign In
                        </button>
                    </form>
                    
                    <p class="account">Don't Have An Account? <a href="/signup">Create Account</a></p>
                    <p class="account"><a href="/forget_password">Forgot Your Password?</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
