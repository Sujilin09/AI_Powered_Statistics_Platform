<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #090808 0%, #825ba9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.4) 0%, transparent 60%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 60%),
                radial-gradient(circle at 40% 40%, rgba(120, 119, 198, 0.3) 0%, transparent 60%),
                radial-gradient(circle at 70% 70%, rgba(102, 126, 234, 0.2) 0%, transparent 50%);
            pointer-events: none;
            animation: backgroundFloat 20s ease-in-out infinite;
        }

        @keyframes backgroundFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
        }

        .signup-form {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            margin: 0 20px;
        }

        .signup-form h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(32px, 5vw, 40px);
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: -0.5px;
            animation: fadeInDown 0.8s ease;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 45px 40px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.15),
                0 10px 20px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(102, 126, 234, 0.05), transparent);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            50% { transform: translateX(0%) translateY(0%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .main {
            position: relative;
            z-index: 1;
        }

        .content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 35px;
            color: #2d3748;
            letter-spacing: -0.3px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .input-group {
            position: relative;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            color: #2d3748;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            position: relative;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 1);
            box-shadow: 
                0 0 0 3px rgba(102, 126, 234, 0.1),
                0 4px 12px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }

        input::placeholder {
            color: #a0aec0;
            font-weight: 400;
        }

        /* Password strength indicator */
        .password-strength {
            margin-top: 8px;
            height: 4px;
            border-radius: 2px;
            background: #e2e8f0;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .strength-bar {
            height: 100%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .strength-weak { width: 33%; background: #f56565; }
        .strength-medium { width: 66%; background: #ed8936; }
        .strength-strong { width: 100%; background: #48bb78; }

        .password-requirements {
            margin-top: 10px;
            font-size: 12px;
            color: #718096;
            line-height: 1.4;
        }

        .requirement {
            margin: 2px 0;
            transition: color 0.3s ease;
        }

        .requirement.met {
            color: #48bb78;
        }

        .requirement::before {
            content: '•';
            margin-right: 6px;
        }

        /* Form validation styles */
        .input-valid {
            border-color: #48bb78 !important;
            box-shadow: 0 0 0 3px rgba(72, 187, 120, 0.1) !important;
        }

        .input-invalid {
            border-color: #f56565 !important;
            box-shadow: 0 0 0 3px rgba(245, 101, 101, 0.1) !important;
        }

        .btn {
            width: 100%;
            padding: 16px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 8px 16px rgba(102, 126, 234, 0.4),
                0 4px 8px rgba(0, 0, 0, 0.1);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            margin-top: 15px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 15px 30px rgba(102, 126, 234, 0.5),
                0 8px 16px rgba(0, 0, 0, 0.15);
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
        }

        .btn:hover:not(:disabled)::before {
            left: 100%;
        }

        .btn:active {
            transform: translateY(-1px) scale(1);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .account {
            text-align: center;
            margin-top: 25px;
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
        }

        .account a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .account a:hover {
            color: #5a67d8;
            text-shadow: 0 2px 4px rgba(102, 126, 234, 0.3);
        }

        .account a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .account a:hover::after {
            width: 100%;
        }

        /* Floating elements */
        .floating-icon {
            position: absolute;
            color: rgba(255, 255, 255, 0.1);
            font-size: 24px;
            animation: float 6s ease-in-out infinite;
            pointer-events: none;
        }

        .floating-icon:nth-child(1) {
            top: 8%;
            left: 8%;
            animation-delay: 0s;
        }

        .floating-icon:nth-child(2) {
            top: 15%;
            right: 12%;
            animation-delay: 2s;
        }

        .floating-icon:nth-child(3) {
            bottom: 25%;
            left: 10%;
            animation-delay: 4s;
        }

        .floating-icon:nth-child(4) {
            bottom: 12%;
            right: 8%;
            animation-delay: 1s;
        }

        .floating-icon:nth-child(5) {
            top: 50%;
            left: 5%;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom alert styling */
        .alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .alert-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .alert-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            margin: 0 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .alert-overlay.show .alert-box {
            transform: scale(1);
        }

        .alert-message {
            color: #2d3748;
            font-size: 16px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .alert-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .alert-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .signup-form {
                margin: 0 15px;
            }

            .container {
                padding: 35px 25px;
            }

            .signup-form h1 {
                font-size: 28px;
                margin-bottom: 30px;
            }

            .content h2 {
                font-size: 24px;
                margin-bottom: 25px;
            }

            input[type="text"],
            input[type="email"],
            input[type="password"],
            .btn {
                padding: 14px 16px;
                font-size: 15px;
            }

            form {
                gap: 18px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .signup-form h1 {
                font-size: 24px;
            }

            .content h2 {
                font-size: 22px;
            }

            form {
                gap: 16px;
            }
        }
    </style>

    <script>
        {% if msg %}
            document.addEventListener('DOMContentLoaded', function() {
                showCustomAlert("{{ msg }}");
            });
        {% endif %}

        function showCustomAlert(message) {
            const overlay = document.createElement('div');
            overlay.className = 'alert-overlay';
            
            const alertBox = document.createElement('div');
            alertBox.className = 'alert-box';
            
            const alertMessage = document.createElement('div');
            alertMessage.className = 'alert-message';
            alertMessage.textContent = message;
            
            const alertButton = document.createElement('button');
            alertButton.className = 'alert-button';
            alertButton.textContent = 'OK';
            alertButton.onclick = function() {
                overlay.classList.remove('show');
                setTimeout(() => overlay.remove(), 300);
            };
            
            alertBox.appendChild(alertMessage);
            alertBox.appendChild(alertButton);
            overlay.appendChild(alertBox);
            document.body.appendChild(overlay);
            
            setTimeout(() => overlay.classList.add('show'), 10);
        }

        // Enhanced form validation
        function validateForm() {
            const email = document.forms["signupForm"]["email"].value;
            const password = document.forms["signupForm"]["password"].value;
            const confirmPassword = document.forms["signupForm"]["confirm_password"].value;
            const userName = document.forms["signupForm"]["user_name"].value;

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#])[A-Za-z\d@$!%*?&#]{8,}$/;

            // Name validation
            if (userName.trim().length < 2) {
                showCustomAlert("Please enter a valid name (at least 2 characters).");
                return false;
            }

            // Email validation
            if (!emailPattern.test(email)) {
                showCustomAlert("Please enter a valid email address.");
                return false;
            }

            // Password validation
            if (!passwordPattern.test(password)) {
                showCustomAlert("Password must be at least 8 characters long, include at least one uppercase letter, one lowercase letter, one number, and one special character.");
                return false;
            }

            // Password confirmation
            if (password !== confirmPassword) {
                showCustomAlert("Passwords do not match.");
                return false;
            }

            return true;
        }

        // Real-time validation and password strength
        document.addEventListener('DOMContentLoaded', function() {
            const emailInput = document.querySelector('input[name="email"]');
            const passwordInput = document.querySelector('input[name="password"]');
            const confirmPasswordInput = document.querySelector('input[name="confirm_password"]');
            const submitButton = document.querySelector('.btn[type="submit"]');

            // Create password strength indicator
            const passwordGroup = passwordInput.parentElement;
            const strengthDiv = document.createElement('div');
            strengthDiv.className = 'password-strength';
            const strengthBar = document.createElement('div');
            strengthBar.className = 'strength-bar';
            strengthDiv.appendChild(strengthBar);
            passwordGroup.appendChild(strengthDiv);

            // Create password requirements
            const requirementsDiv = document.createElement('div');
            requirementsDiv.className = 'password-requirements';
            requirementsDiv.innerHTML = `
                <div class="requirement" id="length">At least 8 characters</div>
                <div class="requirement" id="lowercase">One lowercase letter</div>
                <div class="requirement" id="uppercase">One uppercase letter</div>
                <div class="requirement" id="number">One number</div>
                <div class="requirement" id="special">One special character</div>
            `;
            passwordGroup.appendChild(requirementsDiv);

            // Password strength checking
            passwordInput.addEventListener('input', function() {
                const password = this.value;
                const requirements = {
                    length: password.length >= 8,
                    lowercase: /[a-z]/.test(password),
                    uppercase: /[A-Z]/.test(password),
                    number: /\d/.test(password),
                    special: /[@$!%*?&#]/.test(password)
                };

                let metCount = 0;
                Object.keys(requirements).forEach(req => {
                    const element = document.getElementById(req);
                    if (requirements[req]) {
                        element.classList.add('met');
                        metCount++;
                    } else {
                        element.classList.remove('met');
                    }
                });

                // Update strength bar
                strengthBar.className = 'strength-bar';
                if (metCount < 3) {
                    strengthBar.classList.add('strength-weak');
                } else if (metCount < 5) {
                    strengthBar.classList.add('strength-medium');
                } else {
                    strengthBar.classList.add('strength-strong');
                }

                validateInput(passwordInput, Object.values(requirements).every(Boolean));
            });

            // Real-time email validation
            emailInput.addEventListener('input', function() {
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                validateInput(this, emailPattern.test(this.value));
            });

            // Password confirmation validation
            confirmPasswordInput.addEventListener('input', function() {
                validateInput(this, this.value === passwordInput.value && this.value.length > 0);
            });

            function validateInput(input, isValid) {
                input.classList.remove('input-valid', 'input-invalid');
                if (input.value.length > 0) {
                    input.classList.add(isValid ? 'input-valid' : 'input-invalid');
                }
            }
        });
    </script>
</head>

<body>
    <!-- Floating decorative elements -->
    <div class="floating-icon">👤</div>
    <div class="floating-icon">✨</div>
    <div class="floating-icon">📧</div>
    <div class="floating-icon">🔒</div>
    <div class="floating-icon">🌟</div>

    <div class="signup-form">
        <h1><b>User Registration</b></h1>
        <div class="container">
            <div class="main">
                <div class="content">
                    <h2>Create Account</h2>
                    <form name="signupForm" action="/signup" method="post" onsubmit="return validateForm()">
                        <div class="input-group">
                            <input type="text" name="user_name" placeholder="Enter your full name" required>
                        </div>
                        
                        <div class="input-group">
                            <input type="email" name="email" placeholder="Enter your email address" required>
                        </div>
                        
                        <div class="input-group">
                            <input type="password" name="password" placeholder="Create a strong password" required>
                        </div>
                        
                        <div class="input-group">
                            <input type="password" name="confirm_password" placeholder="Confirm your password" required>
                        </div>
                        
                        <button class="btn" type="submit">
                            Create Account
                        </button>
                    </form>
                    
                    <div class="account">
                        Already have an account? <a href="/">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
